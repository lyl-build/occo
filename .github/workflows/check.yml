name: Check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/occo
      - run: bun typecheck
        working-directory: packages/occo
      - run: bun run pack
        working-directory: packages/occo
      - run: bun run release:source
        working-directory: packages/occo
