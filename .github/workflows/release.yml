name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/occo
      - run: bun typecheck
        working-directory: packages/occo
      - run: bun run pack
        working-directory: packages/occo
      - run: bun run release:source
        working-directory: packages/occo
      - name: Verify the tag matches the package version
        run: |
          version="$(node -p "require('./packages/occo/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        working-directory: packages/occo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
